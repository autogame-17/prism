name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-14
            platform: darwin/universal
            artifact: Prism.app
          - name: Windows (amd64)
            os: windows-2022
            platform: windows/amd64
            artifact: Prism-amd64-installer.exe
          - name: Linux (amd64)
            os: ubuntu-22.04
            platform: linux/amd64
            artifact: Prism
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Linux WebKitGTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Build (${{ matrix.platform }})
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Package macOS dmg
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dist
          hdiutil create -volname "Prism" -srcfolder build/bin/Prism.app -ov -format UDZO build/dist/Prism-${{ runner.arch }}.dmg

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p build/dist
          wails build -platform ${{ matrix.platform }} -nsis -clean
          cp build/bin/Prism-amd64-installer.exe build/dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/bin/
            build/dist/
          if-no-files-found: warn
